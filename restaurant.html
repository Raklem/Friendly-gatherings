<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор ресторана 🍽️</title>
    <style>
        :root {
            --pink-light: #fff0f3;
            --pink-medium: #ffccd5;
            --pink-dark: #ff4d6d;
            --text-main: #594145;
        }

        body {
            background: linear-gradient(135deg, var(--pink-light) 0%, var(--pink-medium) 100%);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15);
            text-align: center;
            max-width: 400px;
            width: 85%;
            margin: 20px;
        }

        .step { display: none; animation: slideUp 0.4s ease-out; }
        .active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: var(--pink-dark); font-size: 1.4rem; margin-bottom: 1.5rem; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }

        button {
            background: #ff8fa3;
            border: none;
            padding: 14px;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        button:hover { background: var(--pink-dark); transform: scale(1.02); }

        .back-btn { background: #e9ecef; color: #6c757d; margin-top: 15px; width: 100%; }

        .map-link {
            display: block;
            font-size: 0.8rem;
            color: var(--pink-dark);
            text-decoration: underline;
            margin-bottom: 5px;
        }

        /* iOS Picker Styles */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            background: #f8f9fa;
            border-radius: 20px;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }

        .picker-column {
            flex: 1;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .picker-column::-webkit-scrollbar { display: none; }

        .picker-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.2rem;
            color: #adb5bd;
            transition: 0.2s;
        }

        .picker-item.selected {
            color: var(--pink-dark);
            font-weight: bold;
            font-size: 1.6rem;
        }

        .picker-highlight {
            position: absolute;
            top: 55px;
            left: 10px;
            right: 10px;
            height: 50px;
            border-top: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
            pointer-events: none;
            background: rgba(255, 77, 109, 0.05);
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 1rem;
            margin-bottom: 10px;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="step-cuisine" class="step active">
        <h1>Какую кухню выберем? 🍽️</h1>
        <div class="btn-group">
            <button onclick="showPlaces('american')">Американская 🍔</button>
            <button onclick="showPlaces('chinese')">Китайская 🥡</button>
            <button onclick="showPlaces('korean')">Корейская 🥢</button>
            <button onclick="showPlaces('mongolian')">Монгольская 🍖</button>
            <button onclick="showPlaces('japan')">Японская 🍣</button>
            <button onclick="showPlaces('indian')">Индийская 🍛</button>
            <button class="back-btn" onclick="location.href='index.html'">← На главную</button>
        </div>
    </div>

    <div id="step-places" class="step">
        <h1 id="cuisine-name">Рестораны</h1>
        <div id="places-list" class="btn-group"></div>
        <button class="back-btn" onclick="goToStep('step-cuisine')">← К кухням</button>
    </div>

    <div id="step-time" class="step">
        <h1 id="selected-place-title"></h1>
        <input type="date" id="date-picker" value="2026-02-14">
        
        <div class="picker-container">
            <div class="picker-highlight"></div>
            <div class="picker-column" id="hours-col" onscroll="updateSelected('hours')"></div>
            <div style="font-weight: bold; font-size: 1.5rem;">:</div>
            <div class="picker-column" id="minutes-col" onscroll="updateSelected('minutes')"></div>
        </div>

        <button onclick="finish()" style="width: 100%;">Запланировать ✨</button>
        <button class="back-btn" onclick="goToStep('step-places')">← Назад к списку</button>
    </div>
</div>

<script>
    const restaurants = {
        american: [
            { name: "Fromagerie MACU", map: "https://maps.app.goo.gl/7YoQ4cLFPTS91Qyc7?g_st=ic" },
            { name: "Cafe Papa", map: "https://maps.app.goo.gl/LXy6jNA3TuU52CSA7" }
        ],
        chinese: [
            { name: "Лянь Хө Хятад ресторан", map: "https://maps.app.goo.gl/TkMtzgc5fEcQwWcm6?g_st=ic" },
            { name: "Zhang Liang Malatang Mongolia", map: "https://maps.app.goo.gl/5hyRYCZ5PS6H3e6b9" }
        ],
        korean: [
            { name: "Koraebul Restaurant Ofitser", map: "https://maps.app.goo.gl/H46xBXoFSDnQsbPJ6?g_st=ic" },
            { name: "Cup Chicken", map: "https://maps.app.goo.gl/Q9cJekgzb6DgruZ17" },
            { name: "소망 삼겹살 가든", map: "https://maps.app.goo.gl/ekaWP5etzYLgJoNr5" }
        ],
        mongolian: [
            { name: "Shim Shid Mongolian Restaurant", map: "https://maps.app.goo.gl/7TKuDHELQXSBm8dA6" },
            { name: "Paris", map: "https://maps.app.goo.gl/emeKMccrwHDLTTAb8" }
        ],
        japan: [
            { name: "Arig Anya", map: "https://maps.app.goo.gl/4GLGj9XnmwuV5WFYA?g_st=ic" },
            { name: "Pepper Lunch Mongolia", map: "https://maps.app.goo.gl/DZ2ubXvSMbom8xrf7" }
        ],
        indian: [
            { name: "Namaste", map: "https://maps.app.goo.gl/Mdh7ahzNnzNsR3Tb8" },
            { name: "Khajuraho - Indian Restaurant", map: "https://maps.app.goo.gl/fcwhoDqyCdFnRxa29" }
        ]
    };

    let finalChoice = { place: '', date: '', time: '' };

    function goToStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showPlaces(cuisine) {
        const list = document.getElementById('places-list');
        list.innerHTML = '';
        document.getElementById('cuisine-name').innerText = cuisine.toUpperCase();
        
        restaurants[cuisine].forEach(res => {
            const item = document.createElement('div');
            item.innerHTML = `
                <a href="${res.map}" target="_blank" class="map-link">Посмотреть на карте 📍</a>
                <button onclick="selectPlace('${res.name}')" style="width:100%">${res.name}</button>
                <div style="height:12px"></div>
            `;
            list.appendChild(item);
        });
        goToStep('step-places');
    }

    function selectPlace(name) {
        finalChoice.place = name;
        document.getElementById('selected-place-title').innerText = name;
        initPickers();
        goToStep('step-time');
    }

    function initPickers() {
        const hCol = document.getElementById('hours-col');
        const mCol = document.getElementById('minutes-col');
        
        if (hCol.innerHTML !== "") return;

        let hHTML = '<div class="picker-item"></div>';
        for(let i=0; i<24; i++) hHTML += `<div class="picker-item">${String(i).padStart(2, '0')}</div>`;
        hCol.innerHTML = hHTML + '<div class="picker-item"></div>';

        let mHTML = '<div class="picker-item"></div>';
        for(let i=0; i<60; i+=5) mHTML += `<div class="picker-item">${String(i).padStart(2, '0')}</div>`;
        mCol.innerHTML = mHTML + '<div class="picker-item"></div>';

        setTimeout(() => { updateSelected('hours'); updateSelected('minutes'); }, 100);
    }

    function updateSelected(type) {
        const col = document.getElementById(type + '-col');
        const items = col.querySelectorAll('.picker-item');
        const scroll = col.scrollTop;
        const index = Math.round(scroll / 50) + 1;
        items.forEach(i => i.classList.remove('selected'));
        if(items[index]) items[index].classList.add('selected');
    }

    function finish() {
        const h = document.getElementById('hours-col').querySelector('.selected').innerText;
        const m = document.getElementById('minutes-col').querySelector('.selected').innerText;
        finalChoice.date = document.getElementById('date-picker').value;
        finalChoice.time = `${h}:${m}`;
        
        const text = `Привет! Идем в ресторан: ${finalChoice.place}\n📅 Дата: ${finalChoice.date}\n⏰ Время: ${finalChoice.time}`;
        window.open(`https://t.me/Raklem?text=${encodeURIComponent(text)}`, '_blank');
    }
</script>

</body>
</html>
