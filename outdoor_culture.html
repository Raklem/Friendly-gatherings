<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Culture & Arts 🏛️</title>
    <style>
        :root {
            --cul-accent: #8e24aa; /* Пурпурный - цвет искусства */
            --cul-bg: #f3e5f5;
            --text: #4a148c;
        }

        body {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--text);
        }

        .container {
            background: white; padding: 2rem; border-radius: 35px;
            box-shadow: 0 15px 35px rgba(142, 36, 170, 0.15);
            text-align: center; max-width: 400px; width: 88%; margin: 20px;
        }

        .step { display: none; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        h1 { color: var(--cul-accent); font-size: 1.4rem; margin-bottom: 1.2rem; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card {
            background: #fff; border: 2px solid #f3e5f5;
            padding: 20px 5px; border-radius: 22px; cursor: pointer; transition: 0.2s;
        }
        .card:hover { border-color: var(--cul-accent); background: #fdfbff; }
        .card span { display: block; margin-top: 8px; font-weight: bold; font-size: 0.85rem; }

        .scroll-list { max-height: 45vh; overflow-y: auto; padding-right: 5px; margin: 15px 0; }
        .place-item {
            background: #fcfaff; border: 1px solid #f3e5f5;
            border-radius: 18px; padding: 12px; margin-bottom: 10px; text-align: left;
        }
        .place-name { font-weight: bold; font-size: 0.9rem; display: block; color: var(--cul-accent); }
        .map-link { color: #512da8; font-size: 0.75rem; text-decoration: none; border-bottom: 1px dashed; }

        .btn-main {
            background: var(--cul-accent); color: white; border: none;
            padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer;
        }
        
        .back-btn { background: none; border: none; color: #9e9e9e; margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 0.85rem; }

        /* ИСПРАВЛЕННЫЕ ЧАСЫ */
        input[type="date"] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 15px; font-family: inherit; }
        .picker-container {
            display: flex; justify-content: center; align-items: center;
            height: 150px; background: #fafafa; border-radius: 20px;
            position: relative; margin-bottom: 20px; overflow: hidden; padding: 0 10px;
        }
        .picker-column {
            flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
            scrollbar-width: none; display: flex; flex-direction: column; align-items: center;
        }
        .picker-column::-webkit-scrollbar { display: none; }
        .picker-item {
            height: 50px; min-height: 50px; display: flex; align-items: center; justify-content: center;
            scroll-snap-align: center; color: #ccc; width: 100%; font-size: 1.1rem; line-height: 50px;
        }
        .picker-item.selected { color: var(--cul-accent); font-weight: bold; font-size: 1.4rem; }
        .highlight {
            position: absolute; top: 50px; left: 10px; right: 10px; height: 50px;
            border-top: 1px solid #eee; border-bottom: 1px solid #eee; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="step-cats" class="step active">
        <h1>Culture Plan 🏛️</h1>
        <div class="grid">
            <div class="card" onclick="openCat('museum')">🖼️<span>Museum</span></div>
            <div class="card" onclick="openCat('theatre')">🎭<span>Theatre</span></div>
            <div class="card" onclick="openCat('cinema')">🎬<span>Cinema</span></div>
            <div class="card" onclick="openCat('library')">📚<span>Library</span></div>
            <div class="card" onclick="openCat('temple')">🏯<span>Temple</span></div>
            <div class="card" onclick="openCat('gallery')">🎨<span>Gallery</span></div>
        </div>
        <button class="back-btn" onclick="location.href='outdoor_menu.html'">← Назад</button>
    </div>

    <div id="step-places" class="step">
        <h1 id="cat-title">Выбери место</h1>
        <div id="places-list" class="scroll-list"></div>
        <button class="back-btn" onclick="goToStep('step-cats')">← Назад</button>
    </div>

    <div id="step-final" class="step">
        <h1 id="selected-place">Название</h1>
        <input type="date" id="date-picker" value="2026-02-16">
        
        <div class="picker-container">
            <div class="highlight"></div>
            <div class="picker-column" id="hours-col" onscroll="updatePick('hours')"></div>
            <div style="font-weight: bold; line-height: 50px;">:</div>
            <div class="picker-column" id="minutes-col" onscroll="updatePick('minutes')"></div>
        </div>

        <p style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">Отправить приглашение:</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <button class="btn-main" style="background: #0088cc; padding: 12px 5px;" onclick="share('tg')">Telegram</button>
            <button class="btn-main" style="background: #25D366; padding: 12px 5px;" onclick="share('wa')">WhatsApp</button>
            <button class="btn-main" style="background: #e1306c; padding: 12px 5px;" onclick="share('inst')">Instagram</button>
            <button class="btn-main" style="background: #0084ff; padding: 12px 5px;" onclick="share('msgr')">Messenger</button>
        </div>

        <button class="back-btn" onclick="goToStep('step-places')">← Изменить локацию</button>
    </div>
</div>

<script>
    const cultureData = {
        museum: [
            { name: "Chinggis Khaan National Museum", map: "https://maps.app.goo.gl/vhAbUNnW2w9WKqKi9" },
            { name: "National Museum of Mongolia", map: "https://maps.app.goo.gl/x6Mu2PyT1vnGCx1T8" },
            { name: "Bogd Khaan Palace Museum", map: "https://maps.app.goo.gl/KhkKxkaBXCSKxBnT6" }
        ],
        theatre: [
            { name: "State Opera and Ballet Theatre", map: "https://maps.google.com/?q=State+Opera+and+Ballet+Academic+Theatre" },
            { name: "National Academic Drama Theatre", map: "https://maps.google.com/?q=National+Academic+Drama+Theatre" }
        ],
        cinema: [
            { name: "Urgoo Cinema", map: "https://maps.google.com/?q=Urgoo+Cinema" },
            { name: "Tengis Cinema", map: "https://maps.google.com/?q=Gegeenten" },
            { name: "Gegeenten Cinema", map: "https://maps.app.goo.gl/Z3rQkvMXQhBkLQXe6" }
        ],
        library: [
            { name: "National Library of Mongolia", map: "https://maps.app.goo.gl/hyFjgsUZrQoBWV9Y9" },
            { name: "Ulaanbaatar Public Library", map: "https://maps.google.com/?q=Steppe+Arena" }
        ],
        temple: [
            { name: "Gandantegchinlen Monastery", map: "https://maps.app.goo.gl/o3JmGeQx6gFkkgjm7" },
            { name: "Choijin Lama Temple Museum", map: "https://maps.google.com/?q=976+Art+Gallery" }
        ],
        gallery: [
            { name: "Mongolian National Art Gallery", map: "http://google.com/maps?q=Big+Bowling+UB" },
            { name: "Zanabazar Fine Arts Museum", map: "http://google.com/maps?q=Misheel+Bowling" }
        ]
    };

    function goToStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openCat(key) {
        document.getElementById('cat-title').innerText = key.toUpperCase();
        const list = document.getElementById('places-list');
        list.innerHTML = '';
        cultureData[key].forEach(p => {
            const div = document.createElement('div');
            div.className = 'place-item';
            div.innerHTML = `
                <span class="place-name">${p.name}</span>
                <a href="${p.map}" target="_blank" class="map-link">На карте 📍</a>
                <button class="btn-main" style="margin-top:10px; padding:8px; font-size:0.8rem;" onclick="confirm('${p.name}')">Выбрать</button>
            `;
            list.appendChild(div);
        });
        goToStep('step-places');
    }

    function confirm(name) {
        document.getElementById('selected-place').innerText = name;
        initPickers();
        goToStep('step-final');
    }

    function initPickers() {
        const h = document.getElementById('hours-col');
        const m = document.getElementById('minutes-col');
        if(h.innerHTML) return;
        let hC = '<div class="picker-item"></div>';
        for(let i=0; i<24; i++) hC += `<div class="picker-item">${String(i).padStart(2,'0')}</div>`;
        h.innerHTML = hC + '<div class="picker-item"></div>';
        let mC = '<div class="picker-item"></div>';
        for(let i=0; i<60; i+=5) mC += `<div class="picker-item">${String(i).padStart(2,'0')}</div>`;
        m.innerHTML = mC + '<div class="picker-item"></div>';
        setTimeout(() => { updatePick('hours'); updatePick('minutes'); }, 50);
    }

    function updatePick(type) {
        const col = document.getElementById(type + '-col');
        const items = col.querySelectorAll('.picker-item');
        const idx = Math.round(col.scrollTop / 50) + 1;
        items.forEach(i => i.classList.remove('selected'));
        if(items[idx]) items[idx].classList.add('selected');
    }

    function share(platform) {
        const name = document.getElementById('selected-place').innerText;
        const d = document.getElementById('date-picker').value;
        const hh = document.getElementById('hours-col').querySelector('.selected').innerText;
        const mm = document.getElementById('minutes-col').querySelector('.selected').innerText;
        
        const text = `Культурный план! 🏛️\n\n📍 Место: ${name}\n📅 Дата: ${d}\n⏰ Время: ${hh}:${mm}\n\nБудет интересно! ✨`;
        const encodedText = encodeURIComponent(text);

        let url = '';
        switch(platform) {
            case 'tg': url = `https://t.me/share/url?url=&text=${encodedText}`; break;
            case 'wa': url = `https://api.whatsapp.com/send?text=${encodedText}`; break;
            case 'inst':
                copyToClipboard(text);
                alert("Текст скопирован! Выбери чат в Direct и вставь сообщение.");
                url = "https://www.instagram.com/direct/inbox/";
                break;
            case 'msgr': url = `fb-messenger://share?link=${encodeURIComponent(window.location.href)}&app_id=123&text=${encodedText}`; break;
        }
        if(url) window.open(url, '_blank');
    }

    function copyToClipboard(text) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
    }
</script>

</body>
</html>
