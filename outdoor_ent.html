<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entertainment 🎮</title>
    <style>
        :root {
            --ent-bg: #f8f0fb;
            --ent-accent: #9d4edd; /* Насыщенный фиолетовый */
            --ent-pink: #ff85a1;
            --text: #240046;
        }

        body {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--text);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.15);
            text-align: center;
            max-width: 400px;
            width: 88%;
            margin: 20px;
        }

        .step { display: none; animation: slideIn 0.4s ease; }
        .active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        h1 { color: var(--ent-accent); font-size: 1.4rem; margin-bottom: 1.2rem; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cat-card {
            background: #fff; border: 2px solid #f3e5f5;
            padding: 15px 5px; border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .cat-card:hover { border-color: var(--ent-accent); background: #fdf0ff; }
        .cat-card span { display: block; margin-top: 5px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }

        .scroll-list { max-height: 45vh; overflow-y: auto; padding-right: 5px; margin: 15px 0; }
        .place-item {
            background: #faf5ff; border: 1px solid #f3e5f5;
            border-radius: 18px; padding: 12px; margin-bottom: 10px; text-align: left;
        }
        .place-name { font-weight: bold; font-size: 0.9rem; display: block; }
        .map-link { color: var(--ent-pink); font-size: 0.75rem; text-decoration: none; font-weight: bold; }

        .btn-main {
            background: var(--ent-accent); color: white; border: none;
            padding: 14px; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(157, 78, 221, 0.3);
        }
        
        .back-btn { background: none; border: none; color: #adb5bd; margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 0.85rem; }

        /* ИСПРАВЛЕННЫЕ РОВНЫЕ ЧАСЫ */
        input[type="date"] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 15px; font-family: inherit; }
        
        .picker-container {
            display: flex; justify-content: center; align-items: center;
            height: 150px; background: #fafafa; border-radius: 20px;
            position: relative; margin-bottom: 20px; overflow: hidden; padding: 0 10px;
        }
        .picker-column {
            flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
            scrollbar-width: none; display: flex; flex-direction: column; align-items: center;
        }
        .picker-column::-webkit-scrollbar { display: none; }
        
        .picker-item {
            height: 50px; min-height: 50px; display: flex; align-items: center; justify-content: center;
            scroll-snap-align: center; color: #ddd; width: 100%; font-size: 1.1rem; line-height: 50px;
        }
        .picker-item.selected { color: var(--ent-accent); font-weight: bold; font-size: 1.4rem; }
        
        .highlight {
            position: absolute; top: 50px; left: 10px; right: 10px; height: 50px;
            border-top: 1px solid #eee; border-bottom: 1px solid #eee; pointer-events: none;
        }

        /* Кнопки соцсетей */
        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .btn-share { padding: 12px; border-radius: 15px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div id="step-cats" class="step active">
        <h1>Entertainment 🎮</h1>
        <div class="grid">
            <div class="cat-card" onclick="openCat('bowling')">🎳<span>Bowling</span></div>
            <div class="cat-card" onclick="openCat('billiard')">🎱<span>Billiard</span></div>
            <div class="cat-card" onclick="openCat('karaoke')">🎤<span>Karaoke</span></div>
            <div class="cat-card" onclick="openCat('arcade')">🕹️<span>Arcade</span></div>
            <div class="cat-card" onclick="openCat('park')">🎡<span>Park</span></div>
            <div class="cat-card" onclick="openCat('budget')">💸<span>Budget</span></div>
            <div class="cat-card" onclick="openCat('photo')">📸<span>Photo</span></div>
            <div class="cat-card" onclick="openCat('coinwalk')">🪙<span>Coinwalk</span></div>
        </div>
        <button class="back-btn" onclick="location.href='outdoor_menu.html'">← К Outdoor</button>
    </div>

    <div id="step-places" class="step">
        <h1 id="cat-title">Выбери место</h1>
        <div id="places-list" class="scroll-list"></div>
        <button class="back-btn" onclick="goToStep('step-cats')">← Назад</button>
    </div>

    <div id="step-final" class="step">
        <h1 id="selected-place" style="margin-bottom: 5px;">Когда?</h1>
        <p style="font-size: 0.8rem; color: #888; margin-top: 0;">Выбери время и позови друзей</p>
        
        <input type="date" id="date-picker" value="2026-02-16">
        
        <div class="picker-container">
            <div class="highlight"></div>
            <div class="picker-column" id="hours-col" onscroll="updatePick('hours')"></div>
            <div style="font-weight: bold; line-height: 50px;">:</div>
            <div class="picker-column" id="minutes-col" onscroll="updatePick('minutes')"></div>
        </div>

        <div class="share-grid">
            <button class="btn-share" style="background: #0088cc;" onclick="share('tg')">Telegram</button>
            <button class="btn-share" style="background: #25D366;" onclick="share('wa')">WhatsApp</button>
            <button class="btn-share" style="background: #e1306c;" onclick="share('inst')">Instagram</button>
            <button class="btn-share" style="background: #0084ff;" onclick="share('msgr')">Messenger</button>
        </div>
        
        <button class="back-btn" onclick="goToStep('step-places')">← Назад</button>
    </div>
</div>

<script>
    const entData = {
        bowling: [
            { name: "Big Bowling (Shangri-La)", map: "http://google.com/maps?q=Big+Bowling+UB" },
            { name: "Misheel Bowling", map: "http://google.com/maps?q=Misheel+Bowling" }
        ],
        billiard: [
            { name: "Champion Billiards Club", map: "http://google.com/maps?q=Champion+Billiard+UB" },
            { name: "Master Club", map: "http://google.com/maps?q=Master+Club+UB" }
        ],
        karaoke: [
            { name: "M-Karaoke", map: "http://google.com/maps?q=M-Karaoke+UB" },
            { name: "Sing Karaoke Club", map: "http://google.com/maps?q=Sing+Karaoke+UB" }
        ],
        arcade: [
            { name: "Game Center (Encanto)", map: "http://google.com/maps?q=Encanto+Game+Center" },
            { name: "PlayStation Center", map: "http://google.com/maps?q=PS+Center+UB" }
        ],
        park: [
            { name: "National Amusement Park", map: "http://google.com/maps?q=Childrens+Park+UB" },
            { name: "Sky Resort Park", map: "http://google.com/maps?q=Sky+Resort" }
        ],
        budget: [
            { name: "Сходить за мороженым 🍦", map: "http://google.com/maps?q=CU+Mongolia" },
            { name: "Прогулка по площади", map: "http://google.com/maps?q=Sukhbaatar+Square" }
        ],
        photo: [
            { name: "Selfie Studio UB", map: "http://google.com/maps?q=Selfie+Studio+UB" },
            { name: "Zaisan Hill (Вид)", map: "http://google.com/maps?q=Zaisan+Hill" }
        ],
        coinwalk: [
            { name: "Coin Toss (Идем куда скажет монетка)", map: "https://www.google.com/search?q=toss+a+coin" }
        ]
    };

    let choice = { place: '' };

    function goToStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openCat(key) {
        document.getElementById('cat-title').innerText = key.toUpperCase();
        const list = document.getElementById('places-list');
        list.innerHTML = '';
        entData[key].forEach(p => {
            const div = document.createElement('div');
            div.className = 'place-item';
            div.innerHTML = `
                <span class="place-name">${p.name}</span>
                <a href="${p.map}" target="_blank" class="map-link">На карте 📍</a>
                <button class="btn-main" style="margin-top:8px; padding:6px; font-size:0.8rem;" onclick="confirm('${p.name}')">Выбрать</button>
            `;
            list.appendChild(div);
        });
        goToStep('step-places');
    }

    function confirm(name) {
        choice.place = name;
        document.getElementById('selected-place').innerText = name;
        initPickers();
        goToStep('step-final');
    }

    function initPickers() {
        const h = document.getElementById('hours-col');
        const m = document.getElementById('minutes-col');
        if(h.innerHTML) return;
        let hC = '<div class="picker-item"></div>';
        for(let i=0; i<24; i++) hC += `<div class="picker-item">${String(i).padStart(2,'0')}</div>`;
        h.innerHTML = hC + '<div class="picker-item"></div>';
        let mC = '<div class="picker-item"></div>';
        for(let i=0; i<60; i+=5) mC += `<div class="picker-item">${String(i).padStart(2,'0')}</div>`;
        m.innerHTML = mC + '<div class="picker-item"></div>';
        setTimeout(() => { updatePick('hours'); updatePick('minutes'); }, 50);
    }

    function updatePick(type) {
        const col = document.getElementById(type + '-col');
        const items = col.querySelectorAll('.picker-item');
        const idx = Math.round(col.scrollTop / 50) + 1;
        items.forEach(i => i.classList.remove('selected'));
        if(items[idx]) items[idx].classList.add('selected');
    }

    function share(platform) {
        const d = document.getElementById('date-picker').value;
        const hh = document.getElementById('hours-col').querySelector('.selected').innerText;
        const mm = document.getElementById('minutes-col').querySelector('.selected').innerText;
        
        const text = `Развлекательный план! 🎮\n\n📍 Место: ${choice.place}\n📅 Дата: ${d}\n⏰ Время: ${hh}:${mm}\n\nБудет весело! 🔥`;
        const encodedText = encodeURIComponent(text);

        let url = '';
        switch(platform) {
            case 'tg': url = `https://t.me/share/url?url=&text=${encodedText}`; break;
            case 'wa': url = `https://api.whatsapp.com/send?text=${encodedText}`; break;
            case 'inst':
                copyToClipboard(text);
                alert("Текст скопирован! Теперь выбери чат в Direct и вставь сообщение.");
                url = "https://www.instagram.com/direct/inbox/";
                break;
            case 'msgr': url = `fb-messenger://share?link=${encodeURIComponent(window.location.href)}&app_id=123&text=${encodedText}`; break;
        }
        if(url) window.open(url, '_blank');
    }

    function copyToClipboard(text) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
    }
</script>
</body>
</html>
