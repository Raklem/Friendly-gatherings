<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Музеи и Галереи 🖼️</title>
    <style>
        :root {
            --pink-light: #fff0f3;
            --pink-medium: #ffccd5;
            --pink-dark: #ff4d6d;
            --text-main: #594145;
        }

        body {
            background: linear-gradient(135deg, var(--pink-light) 0%, var(--pink-medium) 100%);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15);
            text-align: center;
            max-width: 420px;
            width: 85%;
            margin: 20px;
        }

        .step { display: none; animation: slideUp 0.4s ease-out; }
        .active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: var(--pink-dark); font-size: 1.4rem; margin-bottom: 1.5rem; }
        
        .museum-scroll {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        /* Тонкий скроллбар */
        .museum-scroll::-webkit-scrollbar { width: 4px; }
        .museum-scroll::-webkit-scrollbar-thumb { background: var(--pink-medium); border-radius: 10px; }

        .museum-card {
            background: #fffafa;
            border: 1px solid var(--pink-light);
            border-radius: 18px;
            padding: 12px;
            text-align: left;
            transition: 0.2s;
        }

        .museum-card:hover { border-color: var(--pink-dark); }

        .museum-name { font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 8px; line-height: 1.3; }

        .map-btn {
            display: inline-block;
            font-size: 0.7rem;
            color: var(--pink-dark);
            text-decoration: none;
            background: white;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--pink-medium);
            margin-bottom: 10px;
        }

        button.select-btn {
            background: #ff8fa3;
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
        }

        button.select-btn:hover { background: var(--pink-dark); }
        .back-btn { background: #e9ecef; color: #6c757d; margin-top: 10px; width: 100%; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer;}

        /* iOS Picker */
        .picker-container {
            display: flex; justify-content: center; align-items: center;
            height: 160px; background: #f8f9fa; border-radius: 20px;
            position: relative; margin: 20px 0; overflow: hidden;
        }
        .picker-column { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .picker-column::-webkit-scrollbar { display: none; }
        .picker-item { height: 50px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 1.2rem; color: #adb5bd; }
        .picker-item.selected { color: var(--pink-dark); font-weight: bold; font-size: 1.6rem; }
        .picker-highlight { position: absolute; top: 55px; left: 10px; right: 10px; height: 50px; border-top: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; pointer-events: none; }

        input[type="date"] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="step-list" class="step active">
        <h1>Культурный план 🖼️</h1>
        <div class="museum-scroll" id="museum-container">
            </div>
        <button class="back-btn" onclick="location.href='index.html'">← На главную</button>
    </div>

    <div id="step-time" class="step">
        <h1 id="selected-title"></h1>
        <input type="date" id="date-picker" value="2026-02-14">
        
        <div class="picker-container">
            <div class="picker-highlight"></div>
            <div class="picker-column" id="hours-col" onscroll="updateSelected('hours')"></div>
            <div style="font-weight: bold; font-size: 1.5rem;">:</div>
            <div class="picker-column" id="minutes-col" onscroll="updateSelected('minutes')"></div>
        </div>

        <button class="select-btn" style="padding: 15px;" onclick="finish()">Идём просвещаться! ✨</button>
        <button class="back-btn" onclick="goToStep('step-list')">← Назад к списку</button>
    </div>
</div>

<script>
    const museums = [
        { name: "Музей изобразительного искусства им. Дзанабадзара", map: "https://maps.app.goo.gl/vhAbUNnW2w9WKqKi9" },
        { name: "The Natural History Museum of Mongolia", map: "https://maps.app.goo.gl/x6Mu2PyT1vnGCx1T8" },
        { name: "Chinggis Khan National Museum Mongolia", map: "https://maps.app.goo.gl/fJQ6Ber27KjHCKULA" },
        { name: "Монгольский национальный исторический музей", map: "https://maps.app.goo.gl/KhkKxkaBXCSKxBnT6" },
        { name: "Union of Mongolian Artists", map: "https://maps.app.goo.gl/o3JmGeQx6gFkkgjm7" },
        { name: "Museum of Geology and Mineral Resources", map: "https://maps.app.goo.gl/Q5UwEJDebdT5onYJ9" },
        { name: "The Marshall Jukov House Museum", map: "https://maps.app.goo.gl/hEZyY4LoxpR5dHYx6" },
        { name: "Mongolian Railway History Museum", map: "https://maps.app.goo.gl/WMoTQ6DC5kC61duy8" }
    ];

    let finalChoice = { place: '', date: '', time: '' };

    function initList() {
        const container = document.getElementById('museum-container');
        museums.forEach(m => {
            const card = document.createElement('div');
            card.className = 'museum-card';
            card.innerHTML = `
                <span class="museum-name">${m.name}</span>
                <a href="${m.map}" target="_blank" class="map-btn">Карта 📍</a>
                <button class="select-btn" onclick="selectMuseum('${m.name}')">Выбрать</button>
            `;
            container.appendChild(card);
        });
    }

    function goToStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function selectMuseum(name) {
        finalChoice.place = name;
        document.getElementById('selected-title').innerText = name;
        initPickers();
        goToStep('step-time');
    }

    function initPickers() {
        const hCol = document.getElementById('hours-col');
        const mCol = document.getElementById('minutes-col');
        if (hCol.innerHTML !== "") return;

        let hHTML = '<div class="picker-item"></div>';
        for(let i=0; i<24; i++) hHTML += `<div class="picker-item">${String(i).padStart(2, '0')}</div>`;
        hCol.innerHTML = hHTML + '<div class="picker-item"></div>';

        let mHTML = '<div class="picker-item"></div>';
        for(let i=0; i<60; i+=5) mHTML += `<div class="picker-item">${String(i).padStart(2, '0')}</div>`;
        mCol.innerHTML = mHTML + '<div class="picker-item"></div>';

        setTimeout(() => { updateSelected('hours'); updateSelected('minutes'); }, 100);
    }

    function updateSelected(type) {
        const col = document.getElementById(type + '-col');
        const items = col.querySelectorAll('.picker-item');
        const index = Math.round(col.scrollTop / 50) + 1;
        items.forEach(i => i.classList.remove('selected'));
        if(items[index]) items[index].classList.add('selected');
    }

    function finish() {
        const h = document.getElementById('hours-col').querySelector('.selected').innerText;
        const m = document.getElementById('minutes-col').querySelector('.selected').innerText;
        finalChoice.date = document.getElementById('date-picker').value;
        finalChoice.time = `${h}:${m}`;
        
        const text = `Привет! Выбираю музей: ${finalChoice.place}\n📅 Дата: ${finalChoice.date}\n⏰ Время: ${finalChoice.time}\nБуду ждать встречи! 🏛️`;
        window.open(`https://t.me/Raklem?text=${encodeURIComponent(text)}`, '_blank');
    }

    initList();
</script>

</body>
</html>
